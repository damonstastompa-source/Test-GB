<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<meta name="description" content="My God Box — a quiet place to turn over what you cannot control.">
<title>My God Box · v2.0.1</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=1.4.0">
<link rel="apple-touch-icon" href="icon-192.png?v=1.4.0">
<link rel="stylesheet" href="styles.css?v=1.4.0">
</head>
<body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn menu-button" id="menuBtn" aria-label="Open menu">☰</button>
    <button class="brand-button" id="brandHome" aria-label="Go to home"><img src="icon-192.png" alt="" class="brand-icon"><span>My God Box</span></button>
    <button class="icon-btn" id="lockBtn" aria-label="Privacy note">◉</button>
  </header>
  <main id="main" class="screen"></main>
</div>

<div id="drawer" class="drawer-backdrop hidden" aria-hidden="true">
  <aside class="drawer" aria-label="My God Box menu">
    <div class="drawer-head"><div class="drawer-brand"><img src="icon-192.png" alt="" class="drawer-icon"><h2>My God Box</h2></div><button class="icon-btn" id="closeDrawer" aria-label="Close menu">×</button></div>
    <p class="drawer-note">Choose where you'd like to go.</p>
    <div class="drawer-main-links">
      <button class="drawer-link" data-drawer="turned"><span class="drawer-symbol">▤</span><span>Turn It Over</span></button>
      <button class="drawer-link" data-drawer="reflect"><span class="drawer-symbol">♡</span><span>Reflect</span></button>
      <button class="drawer-link" data-drawer="quiet"><span class="drawer-symbol">☾</span><span>Quiet Place</span></button>
    </div>
    <div class="drawer-bottom">
      <button class="drawer-link" data-drawer="settings"><span class="drawer-symbol">⚙</span><span>Settings</span></button>
      <button class="drawer-link" data-drawer="about"><span class="drawer-symbol">ⓘ</span><span>About</span></button>
      <div class="drawer-footer">Everything stays on this device unless you choose to export it.</div>
    </div>
  </aside>
</div>

<div id="modal" class="modal-backdrop hidden"><div class="modal" id="modalContent"></div></div>
<script src="app.js?v=1.4.0"></script>
</body>
</html>
